name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
    paths:
      - 'garminworkouts/**'
      - 'intervalsicu/**'
      - 'trainingplans/**'
      - 'tests/**'
      - 'bot.py'
      - 'account.py'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'garminworkouts/**'
      - 'intervalsicu/**'
      - 'trainingplans/**'
      - 'tests/**'
      - 'bot.py'
      - 'account.py'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: flake8 garminworkouts tests intervalsicu bot.py account.py

  build:
    runs-on: ubuntu-latest
    needs: [lint]

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
      # Dummy athlete profile for unit tests; no repository secrets are exposed here.
      vV02: "5:00"
      fmin: "45"
      rfmax: "185"
      rflt: "168"
      cfmax: "166"
      cflt: "148"
      sfmax: "185"
      sflt: "167"
      rFTP: "358w"
      cFTP: "270w"
      BOT_TOKEN: "dummy-token"

    permissions:
      actions: read
      contents: read
      
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
      - run: pytest --cov --junitxml=junit.xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          env_vars: PYTHON_VERSION
          flags: unittests
          verbose: true
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          env_vars: PYTHON_VERSION
          flags: unittests
          verbose: true

  result:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [build]
    permissions: {}
    steps:
      - run: |
          result="${{ needs.build.result }}"
          if [[ $result == "success" || $result == "skipped" ]]; then
            exit 0
          else
            exit 1
          fi

  tag:
    needs: [build, result]
    if: needs.build.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: "0"

      - name: Increment and tag with CalVer
        uses: mani-sh-reddy/calver-increment@v1.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YEAR_FORMAT: "YY"
