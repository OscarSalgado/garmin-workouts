name: "Garmin update"

on:
  schedule:
    - cron: "17 4 * * *" # Once a day, off-peak: Garmin release bumps are not time-critical
  workflow_dispatch: # Allow manual trigger

# Never overlap: two concurrent runs could both attempt an SSO login.
concurrency:
  group: garmin-update
  cancel-in-progress: false

env:
  GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
  GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
  vV02: ${{ secrets.vV02 }}
  fmin: ${{ secrets.fmin }}
  rfmax: ${{ secrets.rfmax }}
  rflt: ${{ secrets.rflt }}
  rFTP: ${{ secrets.rFTP }}
  cfmax: ${{ secrets.cfmax }}
  cflt: ${{ secrets.cflt }}
  cFTP: ${{ secrets.cFTP }}
  sfmax: ${{ secrets.sfmax }}
  sflt: ${{ secrets.sflt }}
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

jobs:
  garmin-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT }}

      # Garmin rate-limits credential logins (429), so keep a valid token file between runs.
      # Each run saves under a unique key and restores the newest one, so refreshed tokens are
      # persisted even though cache entries are immutable.
      - name: Restore Garmin tokens
        uses: actions/cache/restore@v6
        with:
          path: ~/.garminconnect
          key: garmin-tokens-${{ github.run_id }}
          restore-keys: garmin-tokens-

      - uses: ./.github/actions/setup

      - name: Regenerate Garmin catalogue
        id: update
        shell: bash
        run: |
          set +e
          python -m garminworkouts garmin-update
          status=$?
          if [ "$status" -eq 75 ]; then
            echo "::warning title=Garmin rate limit::Garmin answered 429 Too Many Requests; not retrying. The next scheduled run will try again."
          fi
          exit "$status"

      # Save tokens even when a later step fails, so the next run does not need an SSO login.
      - name: Check for Garmin tokens
        id: tokens
        if: always()
        shell: bash
        run: |
          if [ -s "$HOME/.garminconnect/garmin_tokens.json" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi

      - name: Save Garmin tokens
        if: always() && steps.tokens.outputs.present == 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.garminconnect
          key: garmin-tokens-${{ github.run_id }}

      - name: Lint
        run: flake8 garminworkouts tests

      - name: Test
        run: pytest -q

      # Propose the regenerated files as a PR (no PR when nothing changed)
      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT }}
          branch: bot/garmin-update
          delete-branch: true
          commit-message: Update Garmin
          title: Update Garmin
          body: Files regenerated by the scheduled `garmin-update` job; lint and tests passed.
