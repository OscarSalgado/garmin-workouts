name: "Garmin update"

on:
  schedule:
    - cron: "37 * * * *" # Runs hourly at minute 37 (off-peak: fewer shared-runner SSO 429s)
  workflow_dispatch:

env:
  GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
  GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
  vV02: ${{ secrets.vV02 }}
  fmin: ${{ secrets.fmin }}
  fmax: ${{ secrets.fmax }}
  flt: ${{ secrets.flt }}
  rFTP: ${{ secrets.rFTP }}
  cFTP: ${{ secrets.cFTP }}
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  rfmax: ${{ secrets.rfmax }}
  cfmax: ${{ secrets.cfmax }}
  sfmax: ${{ secrets.sfmax }}
  rflt: ${{ secrets.rflt }}
  cflt: ${{ secrets.cflt }}
  sflt: ${{ secrets.sflt }}

jobs:
  garmin-update:
    runs-on: ubuntu-latest

    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT }}
      # Cache Garmin OAuth tokens so subsequent runs skip SSO login
      # (Garmin rate-limits logins to ~1/hour per account: 429 otherwise)
      - name: Restore Garmin tokens
        uses: actions/cache@v4
        with:
          path: ./garminconnect
          key: garmin-connect-tokens
      - uses: ./.github/actions/setup
      # Run the Garmin workouts update script
      - run: python -m garminworkouts garmin-update

      # Commit all changed files back to the repository
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
            commit_message: Update Garmin
